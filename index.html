<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JMT수학 원생 관리</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; padding-bottom: 60px; }
        header { background-color: #2c3e50; color: white; padding: 15px; text-align: center; font-size: 1.2em; font-weight: bold; }
        .container { padding: 15px; }
        .card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .summary-box { background: #3498db; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .summary-box h2 { margin: 0; font-size: 1.5em; }
        .summary-box p { margin: 5px 0 0 0; font-size: 0.9em; opacity: 0.9; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #ecf0f1; }
        .tab-menu { display: flex; position: fixed; bottom: 0; width: 100%; background: #2c3e50; }
        .tab-menu div { flex: 1; text-align: center; padding: 15px; color: white; cursor: pointer; }
        .tab-menu div.active { background: #34495e; font-weight: bold; border-top: 3px solid #3498db; }
        .hidden { display: none; }
        .paid { color: #27ae60; font-weight: bold; }
        .unpaid { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<header>JMT수학 원생 관리</header>

<!-- 대시보드 화면 -->
<div id="dashboard" class="container">
    <div class="summary-box">
        <p>이번 달 총 납입액</p>
        <h2 id="total-revenue">0원</h2>
    </div>
    
    <div class="card">
        <h3 style="margin-top:0;">전체 학생 명단 및 납입 현황</h3>
        <div style="overflow-x:auto;">
            <table id="dashboard-table">
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>학교/학년/반</th>
                        <th>원비</th>
                        <th>납입일</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 학생 관리(등록/수정) 화면 -->
<div id="management" class="container hidden">
    <div class="card">
        <h3 style="margin-top:0;">신규 학생 등록</h3>
        <form id="student-form">
            <input type="text" id="name" placeholder="학생 이름" required>
            <input type="text" id="school" placeholder="학교명" required>
            <div style="display:flex; gap:10px;">
                <input type="text" id="grade" placeholder="학년" required>
                <input type="text" id="class_name" placeholder="반 (예: 심화A)" required>
            </div>
            <label style="font-size:0.8em; color:#666;">등록일</label>
            <input type="date" id="reg_date" required>
            <input type="number" id="fee" placeholder="학원비 (원)" required>
            <input type="number" id="pay_day" placeholder="매월 납입일 (예: 15)" min="1" max="31" required>
            <select id="pay_status">
                <option value="미납">당월 미납</option>
                <option value="납입완료">당월 납입완료</option>
            </select>
            <label style="font-size:0.8em; color:#666;">퇴원일 (퇴원 시 입력)</label>
            <input type="date" id="leave_date">
            <button type="submit">등록 / 저장</button>
        </form>
    </div>
</div>

<!-- 하단 탭 메뉴 -->
<div class="tab-menu">
    <div id="tab-dashboard" class="active" onclick="switchTab('dashboard')">대시보드</div>
    <div id="tab-management" onclick="switchTab('management')">학생 관리</div>
</div>

<script>
    // 오프라인 작동을 위한 서비스 워커 등록
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log('Service Worker Registered'));
    }

    let students = JSON.parse(localStorage.getItem('jmt_students')) || [];

    // 탭 전환 기능
    function switchTab(tabId) {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('management').classList.add('hidden');
        document.getElementById(tabId).classList.remove('hidden');
        
        document.getElementById('tab-dashboard').classList.remove('active');
        document.getElementById('tab-management').classList.remove('active');
        document.getElementById('tab-' + tabId).classList.add('active');
        
        if(tabId === 'dashboard') renderDashboard();
    }

    // 학생 등록 및 저장
    document.getElementById('student-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const student = {
            id: Date.now(),
            name: document.getElementById('name').value,
            school: document.getElementById('school').value,
            grade: document.getElementById('grade').value,
            className: document.getElementById('class_name').value,
            regDate: document.getElementById('reg_date').value,
            fee: parseInt(document.getElementById('fee').value),
            payDay: document.getElementById('pay_day').value,
            payStatus: document.getElementById('pay_status').value,
            leaveDate: document.getElementById('leave_date').value
        };
        students.push(student);
        localStorage.setItem('jmt_students', JSON.stringify(students));
        alert('학생이 등록되었습니다.');
        this.reset();
        switchTab('dashboard');
    });

    // 대시보드 데이터 렌더링
    function renderDashboard() {
        const tbody = document.querySelector('#dashboard-table tbody');
        tbody.innerHTML = '';
        let totalRevenue = 0;

        // 퇴원하지 않은 활성 학생만 필터링 (퇴원일이 없는 경우)
        const activeStudents = students.filter(s => !s.leaveDate);

        activeStudents.forEach(s => {
            if(s.payStatus === '납입완료') {
                totalRevenue += s.fee;
            }
            const statusClass = s.payStatus === '납입완료' ? 'paid' : 'unpaid';
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${s.name}</td>
                <td style="font-size:0.8em">${s.school}<br>${s.grade} ${s.className}</td>
                <td>${s.fee.toLocaleString()}원</td>
                <td>매월 ${s.payDay}일</td>
                <td class="${statusClass}" onclick="toggleStatus(${s.id})" style="cursor:pointer;">
                    ${s.payStatus}<br><small>(터치하여 변경)</small>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('total-revenue').innerText = totalRevenue.toLocaleString() + '원';
    }

    // 납입 상태 터치로 빠른 변경 기능
    window.toggleStatus = function(id) {
        const index = students.findIndex(s => s.id === id);
        if(index > -1) {
            students[index].payStatus = students[index].payStatus === '미납' ? '납입완료' : '미납';
            localStorage.setItem('jmt_students', JSON.stringify(students));
            renderDashboard();
        }
    }

    // 초기 화면 로드 시 대시보드 렌더링
    renderDashboard();
</script>
</body>
</html>
